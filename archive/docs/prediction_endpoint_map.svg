<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1f2933" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="#f7f8fa" />
  <text x="20" y="24" font-family="Arial, sans-serif" font-size="16" fill="#111827">
    Prediction endpoint flow (high level)
  </text>

  <rect x="20" y="60" width="160" height="70" rx="8" fill="#e0f2fe" stroke="#1f2933" />
  <text x="32" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">Dashboard.jsx</text>
  <text x="32" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">handlePredict()</text>

  <rect x="200" y="60" width="160" height="70" rx="8" fill="#dbeafe" stroke="#1f2933" />
  <text x="212" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">POST /predict</text>
  <text x="212" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">client.js</text>

  <rect x="380" y="60" width="160" height="70" rx="8" fill="#e9d5ff" stroke="#1f2933" />
  <text x="392" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">backend/main.py</text>
  <text x="392" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">predict()</text>

  <rect x="560" y="60" width="160" height="70" rx="8" fill="#fee2e2" stroke="#1f2933" />
  <text x="572" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">PredictionService</text>
  <text x="572" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">predict()</text>

  <rect x="740" y="60" width="160" height="70" rx="8" fill="#fef3c7" stroke="#1f2933" />
  <text x="752" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">build_model_input_row</text>
  <text x="752" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">feature build</text>

  <rect x="920" y="60" width="160" height="70" rx="8" fill="#dcfce7" stroke="#1f2933" />
  <text x="932" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111827">UnifiedPredictionResponse</text>
  <text x="932" y="104" font-family="Arial, sans-serif" font-size="12" fill="#111827">JSON payload</text>

  <line x1="180" y1="95" x2="200" y2="95" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="360" y1="95" x2="380" y2="95" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="540" y1="95" x2="560" y2="95" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="720" y1="95" x2="740" y2="95" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="900" y1="95" x2="920" y2="95" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="20" y="180" width="520" height="90" rx="8" fill="#ffffff" stroke="#1f2933" />
  <text x="32" y="208" font-family="Arial, sans-serif" font-size="12" fill="#111827">
    Startup: load models + dataset, validate schema, cache team history
  </text>
  <text x="32" y="228" font-family="Arial, sans-serif" font-size="12" fill="#111827">
    backend/main.py lifespan() + PredictionService __init__()
  </text>

  <rect x="580" y="180" width="500" height="90" rx="8" fill="#ffffff" stroke="#1f2933" />
  <text x="592" y="208" font-family="Arial, sans-serif" font-size="12" fill="#111827">
    Response: saved to history + UI state
  </text>
  <text x="592" y="228" font-family="Arial, sans-serif" font-size="12" fill="#111827">
    backend/main.py _append_prediction_history_to_disk + usePredictionState
  </text>
