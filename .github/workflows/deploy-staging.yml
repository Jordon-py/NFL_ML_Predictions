name: Deploy Staging

on:
  push:
    branches: [main]

jobs:
  deploy-backend-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Heroku Staging
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP_STAGING }}
        run: |
          if [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_APP" ]; then
            echo "::warning::HEROKU_API_KEY or HEROKU_APP_STAGING not set. Skipping backend deploy."
            exit 0
          fi
          git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git HEAD:main --force

  deploy-frontend-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Vercel Staging
        id: vercel-staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set. Skipping frontend deploy."
            exit 0
          fi
          cd frontend
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          STAGING_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "staging_url=$STAGING_URL" >> $GITHUB_OUTPUT

  health-check-staging:
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-frontend-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Run health checks
        env:
          BACKEND_URL: https://${{ secrets.HEROKU_APP_STAGING }}.herokuapp.com
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh "${BACKEND_URL:-https://nfl-predict-ecf5a5bd34fe.herokuapp.com}" 5 10

      - name: Record staging deployment
        run: |
          echo "Staging deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> staging_deploy.log
          echo "Commit: ${{ github.sha }}" >> staging_deploy.log
