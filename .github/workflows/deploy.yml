name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Heroku CLI (action)
        # Use an action that accepts api key via 'with' to avoid using secrets at top-level
        uses: akshnz/heroku-cli-action@v1
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}

      - name: Verify Heroku login (safe step-level env)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "${HEROKU_API_KEY}" ]; then
            echo "ERROR: HEROKU_API_KEY secret is missing. Add it in Settings → Secrets and Variables → Actions."
            exit 1
          fi
          heroku whoami || true

      - name: Setup Vercel (if used)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          working-directory: ./frontend

      - name: Deploy to Heroku container (conditional)
        if: ${{ secrets.HEROKU_API_KEY && secrets.HEROKU_APP }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP }}
        run: |
          echo "Logging into Heroku container registry..."
          heroku container:login
          echo "Pushing container to Heroku app: $HEROKU_APP"
          heroku container:push web --app "$HEROKU_APP"
          heroku container:release web --app "$HEROKU_APP"

      - name: Fail if required deployment secrets are missing
        if: ${{ !secrets.HEROKU_API_KEY || !secrets.HEROKU_APP || !secrets.VERCEL_TOKEN }}
        run: |
          echo "One or more deployment secrets (HEROKU_API_KEY, HEROKU_APP, VERCEL_TOKEN) are missing."
          echo "Add them at: Settings → Secrets and variables → Actions"
          exit 1
