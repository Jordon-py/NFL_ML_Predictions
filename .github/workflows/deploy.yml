name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-heroku:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required model bundle is committed
        run: |
          set -euo pipefail
          test -f backend/models/home_pipe.joblib
          test -f backend/models/away_pipe.joblib
          test -f backend/models/win_pipe.joblib
          test -f backend/models/score_preprocessor.joblib
          test -f backend/models/win_preprocessor.joblib

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: ${{ secrets.HEROKU_APP }}
        run: |
          set -euo pipefail
          if [ -z "${HEROKU_API_KEY}" ]; then
            echo "ERROR: HEROKU_API_KEY secret is missing. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          HEROKU_APP="${HEROKU_APP:-nfl-predict}"
          git remote remove heroku 2>/dev/null || true
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git"
          git push heroku HEAD:main

      - name: Verify production model gates
        env:
          BACKEND_URL: ${{ secrets.CI_BACKEND_URL }}
        run: |
          set -euo pipefail
          BACKEND_URL="${BACKEND_URL:-https://nfl-predict-ecf5a5bd34fe.herokuapp.com}"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ.get("BACKEND_URL", "https://nfl-predict-ecf5a5bd34fe.herokuapp.com").rstrip("/")
          required_artifacts = [
              "home_pipe",
              "away_pipe",
              "win_pipe",
              "score_preprocessor",
              "win_preprocessor",
          ]

          def fetch_json(path, payload=None):
              data = None
              headers = {"Accept": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(f"{base_url}{path}", data=data, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          status = None
          for _ in range(12):
              status = fetch_json("/status/models")
              artifacts = status.get("artifacts", {})
              if status.get("ready") and all(artifacts.get(name) is True for name in required_artifacts):
                  break
              time.sleep(10)
          else:
              raise SystemExit(f"Model gate failed: {json.dumps(status, sort_keys=True)}")

          payload = {"home_team": "PHI", "away_team": "DAL", "season": 2025, "week": 1}
          prediction = fetch_json("/predict", payload)
          if prediction.get("win_classifier_used") is not True:
              raise SystemExit(f"Predict gate failed: {json.dumps(prediction, sort_keys=True)}")
          print(json.dumps({"status": status, "prediction": prediction}, sort_keys=True))
          PY
