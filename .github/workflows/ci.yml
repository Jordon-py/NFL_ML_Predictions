name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install "pytest>=9.0.0,<10.0.0"

      - name: Verify model bundle runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import sklearn

          metadata_path = Path("backend/models/metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          expected = str(metadata.get("sklearn_version") or "").strip()
          actual = sklearn.__version__

          if not expected:
              raise SystemExit("backend/models/metadata.json is missing sklearn_version")
          if actual != expected:
              raise SystemExit(
                  f"scikit-learn runtime drift: metadata requires {expected}, CI installed {actual}"
              )

          print(f"scikit-learn runtime matches model metadata: {actual}")
          PY

      - name: Run backend tests
        run: |
          python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build frontend
        run: |
          cd frontend
          npm ci
          npm test -- --run
          npm run build

  verify-cors:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify CORS & endpoints (optional)
        env:
          BACKEND_URL: ${{ secrets.CI_BACKEND_URL }}
        run: |
          # The script uses a production Heroku fallback by default; override with CI_BACKEND_URL if provided
          python scripts/verify_api_cors.py --backend-url ${BACKEND_URL:-https://nfl-predict-ecf5a5bd34fe.herokuapp.com}
