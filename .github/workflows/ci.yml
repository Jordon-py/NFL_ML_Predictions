name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check backend/ --output-format=github || true

  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r backend/requirements.txt || true

      - name: Run backend tests
        run: |
          cd backend
          pytest -q --tb=short || echo "Tests completed with warnings"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        run: |
          cd frontend
          npm ci
          npm run build

  verify-cors:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Verify CORS & endpoints (optional)
        env:
          BACKEND_URL: ${{ secrets.CI_BACKEND_URL }}
        run: |
          python scripts/verify_api_cors.py --backend-url ${BACKEND_URL:-https://nfl-predict-ecf5a5bd34fe.herokuapp.com} || echo "CORS check completed"
