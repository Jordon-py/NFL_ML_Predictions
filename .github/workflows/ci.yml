name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, test, and build frontend
        run: |
          cd frontend
          npm ci
          npm test -- --run
          npm run build

  verify-cors:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify CORS & endpoints (optional)
        env:
          BACKEND_URL: ${{ secrets.CI_BACKEND_URL }}
        run: |
          # The script uses a production Heroku fallback by default; override with CI_BACKEND_URL if provided
          python scripts/verify_api_cors.py --backend-url ${BACKEND_URL:-https://nfl-predict-ecf5a5bd34fe.herokuapp.com}
