# heroku.yml - Docker-based Heroku deployment (optional)
# To use this instead of buildpacks, run: heroku stack:set container
# This is an alternative to the standard Python buildpack deployment

build:
  docker:
    web: Dockerfile

run:
  web: gunicorn backend.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120